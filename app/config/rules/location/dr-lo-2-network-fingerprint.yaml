rule_id: "DR-LO-2"
name: "Network Fingerprinting"
category: "location"
priority: "LOW"
enabled: true
description: "Detect consistent network-level signatures from TLS handshake timing and patterns"
version: 1

conditions:
  - type: "network_pattern"
    check: "consistent_tls_timing"
    min_samples: 20
    max_variance_ms: 150

  - type: "network_pattern"
    check: "consistent_user_agent"
    min_samples: 10

actions:
  - type: "create_leak_event"
    leak_type: "LOCATION"
    confidence_base: 0.5

  - type: "calculate_score"
    metrics: ["temporal"]
