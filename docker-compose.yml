version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: wallet_privacy_mysql
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: wallet_privacy
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-ppassword"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: wallet_privacy_app
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      - DATABASE_URL=mysql+aiomysql://root:password@mysql:3306/wallet_privacy
      - TRAFFIC_PROVIDER=mock
    volumes:
      - ./app:/app/app
      - ./tests:/app/tests
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  mysql_data:
